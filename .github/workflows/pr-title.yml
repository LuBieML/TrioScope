name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate pull-request title
        shell: bash
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull-request title must follow Conventional Commits."
            echo "Examples:"
            echo "  fix(scope): correct trigger timing"
            echo "  feat(ui): add 3D path hover"
            echo "  feat!: change saved-profile format"
            exit 1
          fi
